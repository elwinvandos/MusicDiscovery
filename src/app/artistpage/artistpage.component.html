<div class="container-fluid mt-10">
    <h2>Page of <a href="https://open.spotify.com/artist/{{artist.id}}">{{artist.name}}</a></h2>
    <br>
    <h3>Top 10 tracks in België</h3>
    <div *ngFor = "let track of tracks" class="tracklisting">
        {{track.name}}
        <div class="tracklinks">
            <a href="{{track.external_urls.spotify}}"  target="_blank">Beluister Nummer</a>
            <button (click)="addTrack(track);" class="btn btn-outline-dark-green btn-sm addlink" [disabled]="track.hasBeenAdded">Voeg Toe</button>
        </div>
    </div>
</div>
